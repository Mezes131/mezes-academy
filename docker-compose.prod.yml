# Production compose — images only (no build, no git checkout on the host).
# Local/dev stays on docker-compose.yml (build from source).
#
# Required env (see .env on the server + .env.images written by CD):
#   GHCR_OWNER, IMAGE_TAG
#   POSTGRES_PASSWORD, STRAPI_*, STRAPI_API_TOKEN
#   (VITE_* are baked into the web image at CI build time — not needed here)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - strapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  strapi:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/mezes-strapi:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_KEYS: ${STRAPI_APP_KEYS:?STRAPI_APP_KEYS is required}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?STRAPI_API_TOKEN_SALT is required}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?STRAPI_JWT_SECRET is required}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?STRAPI_ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?STRAPI_TRANSFER_TOKEN_SALT is required}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:?STRAPI_ENCRYPTION_KEY is required}
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - public
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/mezes-web:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      strapi:
        condition: service_started
    networks:
      - public
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/mezes-worker:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:?STRAPI_API_TOKEN is required}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      strapi:
        condition: service_started
    networks:
      - public
    restart: unless-stopped

volumes:
  strapi-db:

networks:
  internal:
    internal: true
  public:

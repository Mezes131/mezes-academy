name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Build & push to GHCR, then pull on the VPS.
# The server never receives the git repo — only compose + .env + images.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-and-deploy:
    name: Publish images · pull on server
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Resolve ref
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          SHORT=$(echo "$REF" | cut -c1-7)
          # workflow_dispatch with "main" → resolve after checkout; use run_id fallback tag
          echo "tag=$SHORT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Image tag from commit
        id: sha
        run: |
          TAG=$(git rev-parse --short=7 HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $(git rev-parse HEAD) as tag $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-web:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-web:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_STRAPI_URL=${{ secrets.VITE_STRAPI_URL }}
            VITE_STRAPI_CONTENT_ENABLED=${{ secrets.VITE_STRAPI_CONTENT_ENABLED }}
          cache-from: type=gha,scope=mezes-web
          cache-to: type=gha,mode=max,scope=mezes-web

      - name: Build & push strapi
        uses: docker/build-push-action@v6
        with:
          context: strapi
          file: strapi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-strapi:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-strapi:latest
          cache-from: type=gha,scope=mezes-strapi
          cache-to: type=gha,mode=max,scope=mezes-strapi

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-worker:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mezes-worker:latest
          cache-from: type=gha,scope=mezes-worker
          cache-to: type=gha,mode=max,scope=mezes-worker

      - name: Upload compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull & up on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE_TAG: ${{ steps.sha.outputs.tag }}
          # Ephemeral login for this job only — no GHCR_USER / PAT secrets
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_OWNER,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            test -f .env || { echo "Missing .env on server (secrets only — create once)"; exit 1; }
            test -f docker-compose.prod.yml || { echo "Missing docker-compose.prod.yml"; exit 1; }

            # Image pins (overwritten each deploy — not secrets)
            cat > .env.images <<EOF
            GHCR_OWNER=${GHCR_OWNER}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose \
              --env-file .env \
              --env-file .env.images \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              --env-file .env \
              --env-file .env.images \
              -f docker-compose.prod.yml \
              up -d

            docker logout ghcr.io >/dev/null 2>&1 || true

            docker compose \
              --env-file .env \
              --env-file .env.images \
              -f docker-compose.prod.yml \
              ps

      - name: Smoke — health endpoints
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            curl -sf http://127.0.0.1:5173/ >/dev/null
            code=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:1337/_health || true)
            echo "strapi _health HTTP $code"
            curl -sf http://127.0.0.1:8090/health >/dev/null
            echo "Smoke OK"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  NODE_VERSION: "20"
  # Build-time Vite stubs (CI only — not production secrets)
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: public-anon-key-for-ci
  VITE_STRAPI_URL: http://localhost:1337
  VITE_STRAPI_CONTENT_ENABLED: "false"

jobs:
  # ─── Web quality gates ──────────────────────────────────────────────────────
  web-quality:
    name: Web — lint · types · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ─── Worker ─────────────────────────────────────────────────────────────────
  worker:
    name: Worker — build · self-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Self-check
        run: npm run self-check

  # ─── Strapi package install (lockfile sanity) ───────────────────────────────
  strapi-install:
    name: Strapi — install · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: strapi/package-lock.json

      - name: Install
        run: npm ci

      - name: Build admin
        run: npm run build
        env:
          # Minimal Strapi build env (no DB needed for `strapi build`)
          APP_KEYS: ci1,ci2,ci3,ci4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt
          TRANSFER_TOKEN_SALT: ci-transfer
          JWT_SECRET: ci-jwt
          ENCRYPTION_KEY: ci-encryption-key-32charsxxxx

  # ─── npm audit (dependency CVEs) ────────────────────────────────────────────
  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "worker", "strapi"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        # High/critical only; moderate noise from transitive CMS deps is common
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Trivy filesystem / lockfile scan ───────────────────────────────────────
  trivy-fs:
    name: Trivy — filesystem & lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─── Trivy config (IaC / Dockerfile misconfig) ──────────────────────────────
  trivy-config:
    name: Trivy — Dockerfile / Compose misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"

  # ─── CodeQL (code quality + security) ───────────────────────────────────────
  codeql:
    name: CodeQL — JS/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ─── Container image builds + Trivy image scan ──────────────────────────────
  container-scan:
    name: Containers — build + Trivy image
    runs-on: ubuntu-latest
    needs: [web-quality, worker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: Dockerfile
            image: mezes-web:ci
            build_args: |
              VITE_SUPABASE_URL=https://example.supabase.co
              VITE_SUPABASE_ANON_KEY=public-anon-key-for-ci
              VITE_STRAPI_URL=http://localhost:1337
              VITE_STRAPI_CONTENT_ENABLED=false
          - name: strapi
            context: strapi
            file: strapi/Dockerfile
            image: mezes-strapi:ci
            build_args: ""
          - name: worker
            context: worker
            file: worker/Dockerfile
            image: mezes-worker:ci
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ matrix.image }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "1"

      - name: Upload Trivy image SARIF (${{ matrix.name }})
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  # ─── Gate: all required checks green ────────────────────────────────────────
  ci-ok:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - web-quality
      - worker
      - strapi-install
      - trivy-fs
      - trivy-config
      - codeql
      - container-scan
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "web-quality=${{ needs.web-quality.result }}"
          echo "worker=${{ needs.worker.result }}"
          echo "strapi-install=${{ needs.strapi-install.result }}"
          echo "trivy-fs=${{ needs.trivy-fs.result }}"
          echo "trivy-config=${{ needs.trivy-config.result }}"
          echo "codeql=${{ needs.codeql.result }}"
          echo "container-scan=${{ needs.container-scan.result }}"
          for r in \
            "${{ needs.web-quality.result }}" \
            "${{ needs.worker.result }}" \
            "${{ needs.strapi-install.result }}" \
            "${{ needs.trivy-fs.result }}" \
            "${{ needs.trivy-config.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.container-scan.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "CI gate failed: a required job did not succeed"
              exit 1
            fi
          done
          echo "All required CI jobs passed."
